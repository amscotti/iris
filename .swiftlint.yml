included: [Sources, Tests, Tools/ArchitectureRules/Tests]
excluded: [.build, Iris.app]
opt_in_rules: [force_unwrapping, empty_count, cyclomatic_complexity]
disabled_rules:
  - colon
  - comma
  - control_statement
  - opening_brace
  - closing_brace
  - leading_whitespace
  - trailing_whitespace
  - trailing_comma
  - trailing_semicolon
  - trailing_newline
  - statement_position
  - return_arrow_whitespace
  - shorthand_operator
  - switch_case_alignment
  - vertical_parameter_alignment
  - empty_enum_arguments
  - empty_parameters
  - redundant_void_return
  - void_return
  - multiple_closures_with_trailing_closure
  - no_space_in_method_call
  - syntactic_sugar
  - closure_parameter_position
  - line_length
